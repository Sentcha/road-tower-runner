<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Road Tower Runner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="ui-overlay">
    <div id="score-display">Score: <span id="score">0</span></div>
    <div id="lives-display">Lives: <span id="lives">3</span></div>
    <div id="speed-display">Speed: <span id="speed">1</span>x</div>
  </div>
  <canvas id="gameCanvas"></canvas>
  <div id="start-screen" class="screen">
    <h1>Road Tower Runner</h1>
    <p>Dodge traffic and survive as long as you can!</p>
    <p class="controls-hint">Arrow Keys / WASD to steer &nbsp;|&nbsp; P to pause</p>
    <button id="start-btn">Start Game</button>
  </div>
  <div id="pause-screen" class="screen hidden">
    <h2>Paused</h2>
    <button id="resume-btn">Resume</button>
  </div>
  <div id="game-over-screen" class="screen hidden">
    <h2>Game Over</h2>
    <p>Score: <span id="final-score">0</span></p>
    <p>Best: <span id="best-score">0</span></p>
    <button id="restart-btn">Play Again</button>
  </div>
  <script src="game.js"></script>
</body>
</html>
